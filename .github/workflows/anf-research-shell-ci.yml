# CI — ANF Research Shell (konsolidasi di monorepo security-lab).
# Gate: syntax zsh + 25 test deterministik + smoke launcher.
# Hanya berjalan saat ada perubahan pada anf-research-shell/**.
name: verify-anf-research

on:
  push:
    branches: [main]
    paths:
      - 'anf-research-shell/**'
  pull_request:
    paths:
      - 'anf-research-shell/**'

defaults:
  run:
    working-directory: anf-research-shell

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: make verify
        run: make verify
